name: SnapPaste CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  pull_request:
    branches: [main]

concurrency:
  # 使用 SHA 作为分组。如果同一个提交触发了多次运行（分支+标签），后来的会取消掉先来的。
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check version consistency
        run: npm run check:version
      - name: Check release tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run check:version -- --tag "${{ github.ref_name }}"
      - name: Run frontend tests
        run: npm test
      - name: Type check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Lint all Rust targets
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  build-and-release:
    needs: [frontend-check, rust-check]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write 
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        shell: bash
        run: |
          echo "## Updates" > release_notes.md
          # 尝试获取上一个 tag，如果有的话，就获取上一个 tag 到现在的 commit
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" >> release_notes.md
          else
            # 如果没有上一个 tag，就获取所有 commit（或者你想要限制数量也可以用 -n 10）
            git log --pretty=format:"- %s" >> release_notes.md
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies and build
        run: npm ci && npm run tauri build

      - name: Rename and Zip artifacts
        shell: pwsh
        run: |
          $portableExe = "src-tauri/target/release/SnapPaste.exe"
          if (Test-Path $portableExe) {
              Compress-Archive -Path $portableExe -DestinationPath "src-tauri/target/release/SnapPaste-windows-64-portable.zip" -Force
          }

          $setupExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          
          if ($setupExe) {
              Compress-Archive -Path $setupExe.FullName -DestinationPath "src-tauri/target/release/SnapPaste-windows-64-setup.zip" -Force
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/SnapPaste-windows-64-portable.zip
            src-tauri/target/release/SnapPaste-windows-64-setup.zip
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body_path: release_notes.md
          draft: true 
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
