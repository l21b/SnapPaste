name: SnapPaste CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  windows-quality:
    name: Windows quality checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'
          cache-on-failure: false

      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path 'Cargo.toml' -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($tagVersion -ne $version) {
            throw "Tag '${{ github.ref_name }}' does not match Cargo version '$version'."
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test --all-targets --locked

      - name: Lint all Rust targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Verify release build
        run: cargo build --release --locked

  build-and-release:
    name: Build Windows release
    needs: windows-quality
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'
          cache-on-failure: false

      - name: Build release executable
        run: cargo build --release --locked

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build installer and portable package
        shell: pwsh
        run: |
          $version = (Select-String -Path 'Cargo.toml' -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $releaseDir = 'target/release'
          $portable = "$releaseDir/SnapPaste-$version-windows-x64-portable.zip"
          $installer = "$releaseDir/SnapPaste-$version-setup.exe"
          $checksums = "$releaseDir/SHA256SUMS.txt"
          $makeNsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"

          & $makeNsis "/DAPP_VERSION=$version" 'packaging\windows\SnapPaste.nsi'
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS failed with exit code $LASTEXITCODE."
          }

          Compress-Archive -Path "$releaseDir/SnapPaste.exe" -DestinationPath $portable -Force
          Get-FileHash $portable, $installer -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path $checksums -Encoding ascii

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/SnapPaste-*-windows-x64-portable.zip
            target/release/SnapPaste-*-setup.exe
            target/release/SHA256SUMS.txt
          tag_name: ${{ github.ref_name }}
          name: SnapPaste ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
