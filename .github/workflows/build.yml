name: SnapPaste CI/CD

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to rebuild and package (leave empty for checks only)'
        required: false
        type: string
  push:
    branches: [main]
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  windows-quality:
    name: Windows quality checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'
          cache-on-failure: false

      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $version = (Select-String -Path 'Cargo.toml' -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -notmatch '^v?\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$env:RELEASE_TAG'."
          }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release requires an existing version tag.' }
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          if ($tagVersion -ne $version) {
            throw "Tag '$env:RELEASE_TAG' does not match Cargo version '$version'."
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test --all-targets --locked

      - name: Lint all Rust targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Verify release build
        run: cargo build --release --locked

      - name: Preserve verified release executable
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-executable
          path: target/release/SnapPaste.exe
          if-no-files-found: error
          retention-days: 1

  build-and-release:
    name: Build Windows release
    needs: windows-quality
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download verified release executable
        uses: actions/download-artifact@v4
        with:
          name: windows-release-executable
          path: target/release

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build installer and portable package
        shell: pwsh
        run: |
          $version = (Select-String -Path 'Cargo.toml' -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $releaseDir = 'target/release'
          $portable = "$releaseDir/SnapPaste-$version-windows-x64-portable.zip"
          $installer = "$releaseDir/SnapPaste-$version-setup.exe"
          $checksums = "$releaseDir/SHA256SUMS.txt"
          $makeNsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"

          $installerScript = (Resolve-Path 'packaging\windows\SnapPaste.nsi').Path
          & $makeNsis "/DAPP_VERSION=$version" $installerScript
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS failed with exit code $LASTEXITCODE."
          }

          Compress-Archive -Path "$releaseDir/SnapPaste.exe" -DestinationPath $portable -Force
          Get-FileHash $portable, $installer -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path $checksums -Encoding ascii

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/SnapPaste-*-windows-x64-portable.zip
            target/release/SnapPaste-*-setup.exe
            target/release/SHA256SUMS.txt
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: SnapPaste ${{ inputs.release_tag || github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
